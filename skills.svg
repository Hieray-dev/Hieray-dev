<circle class="ember" cx="310" cy="560" r="1.8" fill="#7c3aed" style="animation-duration:4.8s; animation-delay:1.8s;"/>
<circle class="ember" cx="400" cy="560" r="1.8" fill="#0d9488" style="animation-duration:5.4s; animation-delay:0.3s;"/>
