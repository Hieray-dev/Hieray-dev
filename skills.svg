<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 6px; fill: #ffb347; }
  .cat { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 3px; }
  .pill-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 13px; }
  .trace { fill: none; stroke-width: 2; stroke-linecap: round; animation: travel 3.2s linear infinite; }
  @keyframes travel { to { stroke-dashoffset: -400; } }
  .glowbar { animation: pulse 2.6s ease-in-out infinite; }
  .corner { stroke: #f5a623; stroke-width: 2; fill: none; opacity: .8; }
  .grid { stroke: #ffffff; stroke-opacity: .035; stroke-width: 1; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .25; }
  }
  @keyframes drift {
    0% { transform: translateX(0); }
    50% { transform: translateX(14px); }
    100% { transform: translateX(0); }
  }
  @keyframes glitch {
    0%, 92%, 100% { transform: translate(0,0); opacity: 0; }
    93% { transform: translate(-3px,1px); opacity: .8; }
    95% { transform: translate(3px,-1px); opacity: .8; }
    97% { transform: translate(-2px,0); opacity: .6; }
  }
  @keyframes scan {
    0% { transform: translateY(-40px); }
    100% { transform: translateY(640px); }
  }
  .ember { animation: rise linear infinite; }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: .9; }
    90% { opacity: .5; }
    100% { transform: translateY(-560px); opacity: 0; }
  }
</style>

<radialGradient id="bgGrad" cx="50%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#161022"/>
  <stop offset="45%" stop-color="#0a0713"/>
  <stop offset="100%" stop-color="#020103"/>
</radialGradient>

<radialGradient id="vignette" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
</radialGradient>

<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f5a623"><animate attributeName="stop-color" values="#f5a623;#dc2626;#7c3aed;#0d9488;#f5a623" dur="8s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#0d9488;#f5a623;#dc2626;#7c3aed" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>

<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="8" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
</defs>

<!-- Background -->
<rect x="0" y="0" width="900" height="600" rx="18" fill="url(#bgGrad)"/>
<rect x="0" y="0" width="900" height="600" rx="18" fill="url(#vignette)"/>

<g>
  <g style="animation: drift 12s ease-in-out infinite;">
    <line class="grid" x1="0" y1="60" x2="900" y2="60"/>
    <line class="grid" x1="0" y1="180" x2="900" y2="180"/>
    <line class="grid" x1="0" y1="300" x2="900" y2="300"/>
    <line class="grid" x1="0" y1="420" x2="900" y2="420"/>
    <line class="grid" x1="0" y1="540" x2="900" y2="540"/>
  </g>
</g>

<!-- Frame & Corners -->
<rect x="3" y="3" width="894" height="594" rx="16" fill="none" stroke="url(#frameGrad)" stroke-width="5" opacity="0.22" filter="url(#softglow)"/>
<rect x="3" y="3" width="894" height="594" rx="16" fill="none" stroke="url(#frameGrad)" stroke-width="2" opacity="0.55"/>

<path class="corner" d="M24 60 L24 24 L60 24"/>
<path class="corner" d="M876 60 L876 24 L840 24"/>
<path class="corner" d="M24 540 L24 576 L60 576"/>
<path class="corner" d="M876 540 L876 576 L840 576"/>

<!-- Title -->
<text x="450" y="58" text-anchor="middle" class="title" filter="url(#softglow)">TECH STACK</text>
<rect class="glowbar" x="370" y="72" width="160" height="2.5" fill="#ffb347" filter="url(#glow)"/>
<text x="447" y="58" text-anchor="middle" class="title" fill="#ffb347" style="animation: glitch 6s infinite; opacity:0;">TECH STACK</text>
<text x="453" y="58" text-anchor="middle" class="title" fill="#dc2626" style="animation: glitch 6s infinite .1s; opacity:0;">TECH STACK</text>
<rect x="0" y="0" width="900" height="40" fill="url(#scanGrad)" style="animation: scan 5s linear infinite;"/>

<!-- CATEGORY 1: FRONTEND DEVELOPMENT -->
<text x="450" y="128" text-anchor="middle" class="cat" fill="#93c5fd" filter="url(#glow)">FRONTEND DEVELOPMENT</text>
<rect x="410" y="136" width="80" height="1" fill="#2563eb" opacity="0.5"/>
<g>
  <g class="pill"><rect x="74" y="158" width="82" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="115" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">HTML5</text><rect class="trace" x="74" y="158" width="82" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="170" y="158" width="70" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="205" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">CSS3</text><rect class="trace" x="170" y="158" width="70" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="254" y="158" width="124" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="316" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">JAVASCRIPT</text><rect class="trace" x="254" y="158" width="124" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="392" y="158" width="120" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="452" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">TYPESCRIPT</text><rect class="trace" x="392" y="158" width="120" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="526" y="158" width="80" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="566" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">REACT</text><rect class="trace" x="526" y="158" width="80" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="620" y="158" width="92" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="666" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">NEXT.JS</text><rect class="trace" x="620" y="158" width="92" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="726" y="158" width="100" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="776" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">TAILWIND</text><rect class="trace" x="726" y="158" width="100" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250"/></g>
</g>

<!-- CATEGORY 2: BACKEND DEVELOPMENT -->
<text x="450" y="248" text-anchor="middle" class="cat" fill="#fca5a5" filter="url(#glow)">BACKEND DEVELOPMENT</text>
<rect x="410" y="256" width="80" height="1" fill="#dc2626" opacity="0.5"/>
<g>
  <g class="pill"><rect x="136" y="278" width="94" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="183" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">NODE.JS</text><rect class="trace" x="136" y="278" width="94" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="244" y="278" width="100" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="294" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">EXPRESS</text><rect class="trace" x="244" y="278" width="100" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="358" y="278" width="92" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="404" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">PYTHON</text><rect class="trace" x="358" y="278" width="92" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="464" y="278" width="104" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="516" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">REST API</text><rect class="trace" x="464" y="278" width="104" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="582" y="278" width="100" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="632" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">GRAPHQL</text><rect class="trace" x="582" y="278" width="100" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="696" y="278" width="68" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="730" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">PHP</text><rect class="trace" x="696" y="278" width="68" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250"/></g>
</g>

<!-- CATEGORY 3: DATABASE & STORAGE -->
<text x="450" y="368" text-anchor="middle" class="cat" fill="#c4b5fd" filter="url(#glow)">DATABASE &amp; STORAGE</text>
<rect x="410" y="376" width="80" height="1" fill="#7c3aed" opacity="0.5"/>
<g>
  <g class="pill"><rect x="146" y="398" width="124" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.3" filter="url(#glow)"/><text x="208" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">POSTGRESQL</text><rect class="trace" x="146" y="398" width="124" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="284" y="398" width="82" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.3" filter="url(#glow)"/><text x="325" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">MYSQL</text><rect class="trace" x="284" y="398" width="82" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="380" y="398" width="100" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.3" filter="url(#glow)"/><text x="430" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">MONGODB</text><rect class="trace" x="380" y="398" width="100" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="494" y="398" width="80" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.3" filter="url(#glow)"/><text x="534" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">REDIS</text><rect class="trace" x="494" y="398" width="80" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="588" y="398" width="94" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.3" filter="url(#glow)"/><text x="635" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">PRISMA</text><rect class="trace" x="588" y="398" width="94" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="696" y="398" width="58" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.3" filter="url(#glow)"/><text x="725" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">ORM</text><rect class="trace" x="696" y="398" width="58" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250"/></g>
</g>

<!-- CATEGORY 4: DEVOPS & TOOLS -->
<text x="450" y="488" text-anchor="middle" class="cat" fill="#5eead4" filter="url(#glow)">DEVOPS &amp; TOOLS</text>
<rect x="410" y="496" width="80" height="1" fill="#0d9488" opacity="0.5"/>
<g>
  <g class="pill"><rect x="178" y="518" width="56" height="34" rx="9" fill="#06211d" stroke="#0d9488" stroke-width="1.3" filter="url(#glow)"/><text x="206" y="540" text-anchor="middle" class="pill-text" fill="#99f6e4">GIT</text><rect class="trace" x="178" y="518" width="56" height="34" rx="9" stroke="#0d9488" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="248" y="518" width="92" height="34" rx="9" fill="#06211d" stroke="#0d9488" stroke-width="1.3" filter="url(#glow)"/><text x="294" y="540" text-anchor="middle" class="pill-text" fill="#99f6e4">GITHUB</text><rect class="trace" x="248" y="518" width="92" height="34" rx="9" stroke="#0d9488" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="354" y="518" width="88" height="34" rx="9" fill="#06211d" stroke="#0d9488" stroke-width="1.3" filter="url(#glow)"/><text x="398" y="540" text-anchor="middle" class="pill-text" fill="#99f6e4">DOCKER</text><rect class="trace" x="354" y="518" width="88" height="34" rx="9" stroke="#0d9488" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="456" y="518" width="88" height="34" rx="9" fill="#06211d" stroke="#0d9488" stroke-width="1.3" filter="url(#glow)"/><text x="500" y="540" text-anchor="middle" class="pill-text" fill="#99f6e4">POSTMAN</text><rect class="trace" x="456" y="518" width="88" height="34" rx="9" stroke="#0d9488" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="558" y="518" width="82" height="34" rx="9" fill="#06211d" stroke="#0d9488" stroke-width="1.3" filter="url(#glow)"/><text x="599" y="540" text-anchor="middle" class="pill-text" fill="#99f6e4">VERCEL</text><rect class="trace" x="558" y="518" width="82" height="34" rx="9" stroke="#0d9488" stroke-dasharray="30 250"/></g>
  <g class="pill"><rect x="654" y="518" width="68" height="34" rx="9" fill="#06211d" stroke="#0d9488" stroke-width="1.3" filter="url(#glow)"/><text x="688" y="540" text-anchor="middle" class="pill-text" fill="#99f6e4">LINUX</text><rect class="trace" x="654" y="518" width="68" height="34" rx="9" stroke="#0d9488" stroke-dasharray="30 250"/></g>
</g>

<!-- Animated Embers -->
<circle class="ember" cx="80" cy="560" r="1.8" fill="#f5a623" style="animation-duration:4.2s; animation-delay:0s;"/>
<circle class="ember" cx="150" cy="560" r="1.8" fill="#dc2626" style="animation-duration:5.1s; animation-delay:0.6s;"/>
